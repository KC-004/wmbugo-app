name: CI

on:
  push:
    branches: ['**']

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  gates:
    name: Lint, typecheck, core tests, release build, permissions
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        # Version comes from "packageManager" in package.json.

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Lockfile check
        run: pnpm check:lockfiles

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Core tests
        run: pnpm test:core

      - name: Mobile tests
        run: pnpm --filter mobile test

      - name: Gate self-test
        run: pnpm test:gates

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      # The models are pinned by hash and kept out of git; release builds refuse to run without them.
      - name: Receipt reading models
        run: node scripts/fetch-ocr-models.mjs

      - name: Native receipt reading tests
        working-directory: apps/mobile/android
        run: ./gradlew --no-daemon :app:testNosmsDebugUnitTest --tests "app.wmbugo.ocr.*"

      - name: Release builds (nosms + sms)
        working-directory: apps/mobile/android
        run: ./gradlew --no-daemon assembleNosmsRelease assembleSmsRelease

      - name: Permission allowlist check (both flavors)
        run: pnpm check:permissions

      - name: Resolved release dependencies (both flavors)
        working-directory: apps/mobile/android
        run: |
          mkdir -p app/build/reports
          ./gradlew --no-daemon -q :app:dependencies --configuration nosmsReleaseRuntimeClasspath > app/build/reports/dependencies-nosms.txt
          ./gradlew --no-daemon -q :app:dependencies --configuration smsReleaseRuntimeClasspath > app/build/reports/dependencies-sms.txt

      - name: Dependency denylist (no analytics, crash-reporting, ads, attribution or network SDK)
        run: pnpm check:denylist

      - name: Standard release APKs are not debuggable
        run: pnpm check:not-debuggable

      # Crash records stay on the phone and are never sent, so they are symbolicated offline with these (Story 8.1, AD-19).
      - name: Keep JS source maps and native symbols for this build
        uses: actions/upload-artifact@v4
        with:
          name: release-symbols-${{ github.sha }}
          # A wrong path would silently keep no symbols, and crash records could then never be symbolicated: fail instead.
          if-no-files-found: error
          retention-days: 365
          path: |
            apps/mobile/android/app/build/generated/sourcemaps/react/**/*.map
            apps/mobile/android/app/build/outputs/mapping/**/mapping.txt
            apps/mobile/android/app/build/intermediates/merged_native_libs/**/*.so

  encrypted-db:
    name: Encrypted database header check (emulator)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Build release APK (debuggable so the database can be pulled)
        working-directory: apps/mobile/android
        run: ./gradlew --no-daemon assembleNosmsRelease -PwmbugoDebuggableRelease
      - name: First launch on an emulator, pull the database, check its header
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          script: bash scripts/ci-check-encrypted-db.sh
