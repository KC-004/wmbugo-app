name: CI

on:
  push:
    branches: ['**']

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  gates:
    name: Lint, typecheck, core tests, release build, permissions
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        # Version comes from "packageManager" in package.json.

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Lockfile check
        run: pnpm check:lockfiles

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Core tests
        run: pnpm test:core

      - name: Mobile tests
        run: pnpm --filter mobile test

      - name: Gate self-test
        run: pnpm test:gates

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Release builds (nosms + sms)
        working-directory: apps/mobile/android
        run: ./gradlew --no-daemon assembleNosmsRelease assembleSmsRelease

      - name: Permission allowlist check (both flavors)
        run: pnpm check:permissions
